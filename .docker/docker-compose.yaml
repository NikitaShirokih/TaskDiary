name: taskdiary

services:
    nginx:
        image: nginx:alpine
        container_name: nginx
        ports:
            - "${NGINX_HTTP_PORT:-8082}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        volumes:
            - ..:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - app-network
        depends_on:
            - php

    php:
        build:
            context: ..
            dockerfile: .docker/php-fpm/Dockerfile
        container_name: task_diary_php
        volumes:
            - ..:/var/www/html
            - ./php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./php-fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf
        environment:
            - APP_ENV=${APP_ENV:-dev}
            - APP_DEBUG=${APP_DEBUG:-true}
            - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8082}
            - DB_HOST=${DB_HOST:-postgres}
            - DB_NAME=${DB_NAME:-taskdiary}
            - DB_USER=${DB_USER:-user}
            - DB_PASSWORD=${DB_PASSWORD:-password}
            - REDIS_DSN=${REDIS_DSN:-redis://redis:6379}
        networks:
            - app-network
        depends_on:
            - postgres
            - redis
        restart: unless-stopped

    postgres:
        image: postgres:15-alpine
        container_name: task_diary_postgres
        environment:
            POSTGRES_DB: ${DB_NAME:-taskdiary}
            POSTGRES_USER: ${DB_USER:-user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "${POSTGRES_PORT:-5433}:5432"
        networks:
            - app-network
        restart: unless-stopped

    redis:
        image: redis:7.2-alpine
        container_name: task_diary_redis
        command: redis-server --appendonly no --save ""
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        restart: unless-stopped
        networks:
            - app-network

    mailpit:
        image: axllent/mailpit:latest
        container_name: task_diary_mailpit
        ports:
            - "${MAILPIT_HTTP_PORT:-8025}:8025"
        networks:
            - app-network
        restart: unless-stopped

networks:
    app-network:
        driver: bridge

volumes:
    postgres_data:
        driver: local
