services:
    # Nginx - веб-сервер
    nginx:
        image: nginx:alpine
        ports:
            - "8082:80"
            - "443:443"
        volumes:
            - ..:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - app-network
        depends_on:
            - php

    # PHP-FPM - обработчик PHP
    php:
        build:
            context: ..
            dockerfile: .docker/php-fpm/Dockerfile
        container_name: task_diary_php
        volumes:
            - ..:/var/www/html
            - ./php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./php-fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf
        environment:
            - APP_ENV=dev
            - APP_DEBUG=true
            - DB_HOST=mysql
            - DB_NAME=taskdiary
            - DB_USER=selectel
            - DB_PASSWORD=MyPass123!
        networks:
            - app-network
        depends_on:
            - mysql
        restart: unless-stopped

    # MySQL - база данных
    mysql:
        image: mysql:8.0
        container_name: task_diary_mysql
        environment:
            MYSQL_DATABASE: taskdiary
            MYSQL_USER: selectel
            MYSQL_PASSWORD: MyPass123!
            MYSQL_ROOT_PASSWORD: MyPass123!
            MYSQL_CHARSET: utf8mb4
            MYSQL_COLLATION: utf8mb4_unicode_ci
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - "3307:3306"
        networks:
            - app-network
        restart: unless-stopped

    # phpMyAdmin - веб-интерфейс для БД
    phpmyadmin:
        image: phpmyadmin:latest
        container_name: task_diary_phpmyadmin
        ports:
            - "8081:80"
        environment:
            - PMA_HOST=mysql
            - PMA_PORT=3306
            - UPLOAD_LIMIT=64M
        networks:
            - app-network
        depends_on:
            - mysql
        restart: unless-stopped

networks:
    app-network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
