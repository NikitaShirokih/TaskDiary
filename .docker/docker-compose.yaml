services:
    nginx:
        image: nginx:alpine
        container_name: nginx
        ports:
            - "${NGINX_HTTP_PORT:-8082}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        volumes:
            - ..:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - app-network
        depends_on:
            - php

    php:
        build:
            context: ..
            dockerfile: .docker/php-fpm/Dockerfile
        container_name: task_diary_php
        volumes:
            - ..:/var/www/html
            - ./php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./php-fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf
        environment:
            - APP_ENV=${APP_ENV:-dev}
            - APP_DEBUG=${APP_DEBUG:-true}
            - DB_HOST=${DB_HOST:-mysql}
            - DB_NAME=${DB_NAME:-taskdiary}
            - DB_USER=${DB_USER:-selectel}
            - DB_PASSWORD=${DB_PASSWORD}
        networks:
            - app-network
        depends_on:
            - mysql
        restart: unless-stopped

    mysql:
        image: mysql:8.0
        container_name: task_diary_mysql
        environment:
            MYSQL_DATABASE: ${DB_NAME:-taskdiary}
            MYSQL_USER: ${DB_USER:-selectel}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_CHARSET: utf8mb4
            MYSQL_COLLATION: utf8mb4_unicode_ci
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - "${MYSQL_PORT:-3307}:3306"
        networks:
            - app-network
        restart: unless-stopped

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: task_diary_phpmyadmin
        ports:
            - "${PHPMYADMIN_PORT:-8081}:80"
        environment:
            - PMA_HOST=${DB_HOST:-mysql}
            - PMA_PORT=${DB_PORT:-3306}
            - UPLOAD_LIMIT=64M
        networks:
            - app-network
        depends_on:
            - mysql
        restart: unless-stopped

networks:
    app-network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
