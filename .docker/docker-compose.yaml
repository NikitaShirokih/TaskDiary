services:
    nginx:
        image: nginx:alpine
        container_name: nginx
        ports:
            - "${NGINX_HTTP_PORT:-8082}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        volumes:
            - ..:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - app-network
        depends_on:
            - php

    php:
        build:
            context: ..
            dockerfile: .docker/php-fpm/Dockerfile
        container_name: task_diary_php
        volumes:
            - ..:/var/www/html
            - ./php-fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
            - ./php-fpm/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf
        environment:
            - APP_ENV=${APP_ENV:-dev}
            - APP_DEBUG=${APP_DEBUG:-true}
            - DB_HOST=${DB_HOST:-postgres}
            - DB_NAME=${DB_NAME:-taskdiary}
            - DB_USER=${DB_USER:-user}
            - DB_PASSWORD=${DB_PASSWORD:-password}
        networks:
            - app-network
        depends_on:
            - postgres
        restart: unless-stopped

    postgres:
        image: postgres:15-alpine
        container_name: task_diary_postgres
        environment:
            POSTGRES_DB: ${DB_NAME:-taskdiary}
            POSTGRES_USER: ${DB_USER:-user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        networks:
            - app-network
        restart: unless-stopped


networks:
    app-network:
        driver: bridge

volumes:
    postgres_data:
        driver: local
