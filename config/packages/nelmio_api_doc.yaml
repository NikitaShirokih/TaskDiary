nelmio_api_doc:
    documentation:
        info:
            title: TaskDiary API
            description: REST API для управления задачами, подзадачами и статусами через Bearer token.
            version: 1.0.0

        components:
            securitySchemes:
                BearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: API token

        security:
            - BearerAuth: []

    areas:
        path_patterns:
            - ^/api(?!/doc)