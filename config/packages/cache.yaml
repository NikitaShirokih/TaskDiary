framework:
    cache:
        default_redis_provider: '%env(REDIS_DSN)%'

        pools:
            dashboard.cache:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_DSN)%'
                default_lifetime: 600

when@test:
    framework:
        cache:
            pools:
                dashboard.cache:
                    adapter: cache.adapter.array
                    provider: null
