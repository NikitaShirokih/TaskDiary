framework:
    rate_limiter:
        login:
            policy: fixed_window
            limit: 5
            interval: '1 minute'

        forgot_password:
            policy: fixed_window
            limit: 3
            interval: '10 minutes'

        reset_password:
            policy: fixed_window
            limit: 5
            interval: '10 minutes'

        api:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
