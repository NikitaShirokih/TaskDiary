parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

        bind:
            string $apiKey: '%env(GIGACHAT_API_KEY)%'
            string $mailFromAddress: '%env(MAIL_FROM_ADDRESS)%'
            string $mailFromName: '%env(MAIL_FROM_NAME)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Common/Entity/'
            - '../src/Module/*/Entity/'
            - '../src/Kernel.php'

    App\Module\Ai\Contract\PromptBuilderInterface:
        alias: App\Module\Ai\Builder\TaskAdvicePromptBuilder

    App\Module\Ai\Prompt\TaskPromptContextFactory:
        arguments:
            $maxDepth: 3
            $maxRelationsPerNode: 3

    _instanceof:
        App\Module\Ai\Contract\FieldRendererInterface:
            tags: ['app.field_renderer']

    App\Module\Ai\Prompt\TaskRelationTreeRenderer:
        arguments:
            $fieldRenderers: !tagged_iterator app.field_renderer

    App\Module\Task\Service\DashboardStatsQueryService:
        arguments:
            $dashboardCache: '@dashboard.cache'

    App\Module\Task\Service\TaskCacheInvalidator:
        arguments:
            $dashboardCache: '@dashboard.cache'
