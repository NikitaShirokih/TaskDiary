parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

        bind:
            string $apiKey: '%env(GIGACHAT_API_KEY)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Contract\PromptBuilderInterface:
        alias: App\Builder\TaskAdvicePromptBuilder

    App\Prompt\TaskPromptContextFactory:
        arguments:
            $maxDepth: 3
            $maxRelationsPerNode: 3

    _instanceof:
        App\Contract\FieldRendererInterface:
            tags: ['app.field_renderer']

    App\Prompt\TaskRelationTreeRenderer:
        arguments:
            $fieldRenderers: !tagged_iterator app.field_renderer
